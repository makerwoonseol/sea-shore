<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Wave Sand Canvas</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        position: fixed;
        top: 0;
        left: 0;
        background-color: #e2d1a6;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #sandCanvas {
        z-index: 1;
      }
      #drawCanvas {
        z-index: 2;
      }
      #waveCanvas {
        z-index: 3;
      }

      #version-tag {
        position: fixed;
        bottom: 10px;
        right: 10px;
        background: rgba(0, 0, 0, 0.8);
        color: #00ff00;
        padding: 6px 10px;
        font-size: 12px;
        font-family: monospace;
        border-radius: 4px;
        z-index: 9999;
        pointer-events: none;
      }
      #debug-log {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        max-height: 200px;
        background: rgba(0, 0, 0, 0.95);
        color: #ff5555;
        font-size: 12px;
        font-family: monospace;
        z-index: 10000;
        overflow-y: auto;
        padding: 10px;
        display: none;
        word-break: break-all;
      }
    </style>

    <!-- 독립된 에러 핸들러 (메인 코드 실행 전 로드) -->
    <script>
      window.onerror = function (msg, url, line, col, error) {
        var div = document.getElementById("debug-log");
        if (div) {
          div.style.display = "block";
          div.innerHTML +=
            '<div style="margin-bottom:4px;border-bottom:1px solid #444;">[JS Error] ' +
            msg +
            " (Line: " +
            line +
            ")</div>";
        }
        return false;
      };
    </script>
  </head>
  <body>
    <div id="debug-log"></div>
    <div id="version-tag">v1.4.0 (Instant Auto-Start)</div>

    <!-- 레이어별 캔버스 명시 -->
    <canvas id="sandCanvas"></canvas>
    <canvas id="drawCanvas"></canvas>
    <canvas id="waveCanvas"></canvas>

    <script>
      // 1. 파도 데이터 포인트
      function Point(index, x, y, speed) {
        this.x = x;
        this.y = y;
        this.targetY = y;
        this.speed = speed;
        this.cur = index;
      }

      Point.prototype.update = function () {
        if (this.y < this.targetY) {
          this.y += this.speed * 2;
          if (this.y > this.targetY) this.y = this.targetY;
        } else if (this.y > this.targetY) {
          this.y -= this.speed;
          if (this.y < this.targetY) this.y = this.targetY;
        }
      };

      // 2. 튜브 오브젝트
      function Tube(x, y, radius, point) {
        this.x = x;
        this.y = y;
        this.radius = radius;
        this.point = point;
        this.time = 0;
        this.rotation = 0;
      }

      Tube.prototype.update = function (isResetting) {
        this.time += 0.03;
        this.rotation = Math.sin(this.time) * 0.2;

        if (this.point) {
          var targetY = this.point.y - this.radius * 0.2;
          this.y += (targetY - this.y) * 0.15;
        } else {
          if (isResetting) {
            this.y += 2.5;
          } else {
            this.y -= 1.2;
          }
        }
      };

      Tube.prototype.isOut = function () {
        return (
          this.y + this.radius * 2 < -50 || this.y > window.innerHeight + 100
        );
      };

      Tube.prototype.draw = function (ctx) {
        var PI = Math.PI;
        var sector = PI * 0.166666;

        // 그림자
        ctx.save();
        ctx.translate(this.x + 8, this.y + 8);
        ctx.globalAlpha = 0.2;
        ctx.fillStyle = "#000000";
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, PI * 2);
        ctx.fill();
        ctx.restore();

        // 튜브 본체
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);

        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, PI * 2, false);
        ctx.arc(0, 0, 25, 0, PI * 2, true);
        ctx.clip();

        ctx.fillStyle = "#F2360C";
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, PI * 2, false);
        ctx.fill();

        ctx.fillStyle = "#FFFFFF";
        for (var i = 0; i < 4; i++) {
          var angle = i * PI * 0.5;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.arc(0, 0, this.radius, angle, angle + sector, false);
          ctx.fill();
        }

        ctx.restore();
      };

      // 3. 손가락/마우스 모래 낙서
      function Drawing(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext("2d");
        this.hasDrawn = false;
        this.lastDrawTime = 0;
        this.mouse = { x: 0, y: 0 };
        this.lastMouse = { x: 0, y: 0 };
        this.isDrawing = false;

        var self = this;

        function getPos(e) {
          if (e.touches && e.touches.length > 0) {
            return { x: e.touches[0].clientX, y: e.touches[0].clientY };
          }
          return { x: e.clientX || 0, y: e.clientY || 0 };
        }

        function onStart(e) {
          self.isDrawing = true;
          var p = getPos(e);
          self.mouse.x = p.x;
          self.mouse.y = p.y;
          self.lastMouse.x = p.x;
          self.lastMouse.y = p.y;
        }

        function onMove(e) {
          if (!self.isDrawing) return;
          var p = getPos(e);
          self.mouse.x = p.x;
          self.mouse.y = p.y;

          var dx = self.mouse.x - self.lastMouse.x;
          var dy = self.mouse.y - self.lastMouse.y;
          var dist = Math.sqrt(dx * dx + dy * dy);

          var steps = Math.max(Math.floor(dist * 0.5), 2);
          for (var i = 0; i <= steps; i++) {
            var x = self.lastMouse.x + (dx / steps) * i;
            var y = self.lastMouse.y + (dy / steps) * i;
            self.drawBrush(x, y, dist);
          }

          self.lastMouse.x = self.mouse.x;
          self.lastMouse.y = self.mouse.y;
        }

        function onEnd() {
          self.isDrawing = false;
        }

        window.addEventListener("mousedown", onStart);
        window.addEventListener("mousemove", onMove);
        window.addEventListener("mouseup", onEnd);

        window.addEventListener("touchstart", onStart, { passive: true });
        window.addEventListener("touchmove", onMove, { passive: true });
        window.addEventListener("touchend", onEnd, { passive: true });
      }

      Drawing.prototype.drawBrush = function (x, y, speed) {
        var count = speed > 10 ? 6 : 14;
        var spread = speed > 10 ? 10 : 5;

        this.hasDrawn = true;
        this.lastDrawTime = Date.now();

        for (var i = 0; i < count; i++) {
          var px = x + (Math.random() * spread * 2 - spread);
          var py = y + (Math.random() * spread * 2 - spread);
          var r = Math.random() * 1.5 + 1;

          this.ctx.fillStyle =
            Math.random() > 0.3
              ? "rgba(110, 85, 45, 0.5)"
              : "rgba(255, 245, 220, 0.6)";
          this.ctx.beginPath();
          this.ctx.arc(px, py, r, 0, Math.PI * 2);
          this.ctx.fill();
        }
      };

      Drawing.prototype.clear = function () {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        this.hasDrawn = false;
      };

      // 4. 단일 파도
      function Wave(index, totalPoints, color) {
        this.index = index;
        this.totalPoints = totalPoints;
        this.color = color;
        this.isBack = false;
        this.points = [];
        this.delay = 0;
        this.isResetWave = false;
        this.resetFinished = false;
      }

      Wave.prototype.resize = function (w, h) {
        this.stageWidth = w;
        this.stageHeight = h;
        this.pointGap = this.stageWidth / (this.totalPoints - 1);
        this.init();
      };

      Wave.prototype.init = function () {
        this.points = [];
        for (var i = 0; i < this.totalPoints; i++) {
          var speed = Math.random() * 0.4 + 0.4;
          this.points[i] = new Point(
            this.index + i,
            this.pointGap * i,
            0,
            speed,
          );
        }
        this.makeWave();
      };

      Wave.prototype.makeWave = function () {
        for (var i = 0; i < this.totalPoints; i++) {
          this.points[i].targetY = 200 + Math.random() * 200;
          this.points[i].speed = Math.random() * 1.2 + 1;
        }
      };

      Wave.prototype.goBack = function () {
        for (var i = 0; i < this.totalPoints; i++) {
          this.points[i].targetY = 0;
          this.points[i].speed = Math.random() * 2 + 0.5;
        }
      };

      Wave.prototype.resetWave = function () {
        this.isResetWave = true;
        for (var i = 0; i < this.totalPoints; i++) {
          this.points[i].y = 0;
          this.points[i].targetY = this.stageHeight;
          this.points[i].speed = Math.random() * 1.2 + 1;
        }
      };

      Wave.prototype.draw = function (ctx) {
        if (this.delay > 0) {
          this.delay--;
          return;
        }

        var arrivedCount = 0;
        for (var j = 0; j < this.totalPoints; j++) {
          if (this.points[j].y === this.points[j].targetY) {
            arrivedCount++;
          }
          this.points[j].update();
        }

        this.drawWave(ctx, this.points, 0.85, this.color);

        if (arrivedCount === this.totalPoints) {
          if (this.isResetWave) {
            this.resetFinished = true;
            this.isResetWave = false;
            this.makeWave();
            return;
          }

          if (!this.isBack) {
            this.goBack();
            this.isBack = true;
          } else {
            this.makeWave();
            this.isBack = false;
          }
        }
      };

      Wave.prototype.drawWave = function (ctx, points, alpha, waveColor) {
        var prevX = points[0].x;
        var prevY = points[0].y;

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.moveTo(prevX, prevY);
        ctx.fillStyle = waveColor;

        for (var i = 1; i < this.totalPoints; i++) {
          var cx = (prevX + points[i].x) * 0.5;
          var cy = (prevY + points[i].y) * 0.5;
          ctx.quadraticCurveTo(prevX, prevY, cx, cy);
          prevX = points[i].x;
          prevY = points[i].y;
        }
        ctx.lineTo(prevX, prevY);
        ctx.lineTo(this.stageWidth, 0);
        ctx.lineTo(0, 0);
        ctx.fill();
        ctx.restore();
      };

      // 5. 파도 그룹 & 튜브 관리
      function WaveGroup() {
        this.waves = [
          new Wave(1, 6, "#8fd4ff"),
          new Wave(1, 6, "#0088ff"),
          new Wave(1, 6, "#0055d4"),
        ];
        this.waves[0].delay = 30;
        this.waves[1].delay = 15;
        this.waves[2].delay = 0;
        this.isResetting = false;
        this.resetFinished = false;
        this.hasTriggeredClear = false;
        this.tubes = [];
      }

      WaveGroup.prototype.resize = function (w, h) {
        for (var i = 0; i < this.waves.length; i++) {
          this.waves[i].resize(w, h);
        }
      };

      WaveGroup.prototype.update = function () {
        for (var i = this.tubes.length - 1; i >= 0; i--) {
          var tube = this.tubes[i];
          tube.update(this.isResetting);
          if (tube.isOut()) {
            this.tubes.splice(i, 1);
          }
        }
      };

      WaveGroup.prototype.draw = function (ctx, waveReset) {
        for (var i = 0; i < this.waves.length; i++) {
          this.waves[i].draw(ctx);
        }

        for (var j = 0; j < this.tubes.length; j++) {
          this.tubes[j].draw(ctx);
        }

        if (waveReset && !this.isResetting) {
          this.isResetting = true;
          this.hasTriggeredClear = false;
          for (var k = 0; k < this.waves.length; k++) {
            this.waves[k].resetWave();
          }

          var targetWave = this.waves[0];
          if (targetWave && targetWave.points.length > 0) {
            var pointIdx = Math.floor(Math.random() * targetWave.points.length);
            var selectedPoint = targetWave.points[pointIdx];
            this.tubes.push(
              new Tube(selectedPoint.x, selectedPoint.y, 45, selectedPoint),
            );
          }
        }

        this.resetFinished = false;

        if (this.isResetting) {
          for (var m = 0; m < this.waves.length; m++) {
            if (this.waves[m].resetFinished) {
              if (!this.hasTriggeredClear) {
                this.resetFinished = true;
                this.hasTriggeredClear = true;
              }
              this.waves[m].resetFinished = false;
            }
          }

          var anyResetting = false;
          for (var n = 0; n < this.waves.length; n++) {
            if (this.waves[n].isResetWave) {
              anyResetting = true;
              break;
            }
          }
          if (!anyResetting) this.isResetting = false;
        }
      };

      // 6. 메인 앱 시작
      function App() {
        this.sandCanvas = document.getElementById("sandCanvas");
        this.sandCtx = this.sandCanvas.getContext("2d");

        this.drawCanvas = document.getElementById("drawCanvas");
        this.drawCtx = this.drawCanvas.getContext("2d");

        this.waveCanvas = document.getElementById("waveCanvas");
        this.waveCtx = this.waveCanvas.getContext("2d");

        this.waveGroup = new WaveGroup();
        this.drawing = new Drawing(this.drawCanvas);

        var self = this;
        window.addEventListener("resize", function () {
          self.resize();
        });
        this.resize();

        this.lastFrameTime = 0;
        requestAnimationFrame(function (t) {
          self.animate(t);
        });
      }

      App.prototype.resize = function () {
        var w =
          window.innerWidth || document.documentElement.clientWidth || 800;
        var h =
          window.innerHeight || document.documentElement.clientHeight || 600;

        this.sandCanvas.width = w;
        this.sandCanvas.height = h;
        this.drawCanvas.width = w;
        this.drawCanvas.height = h;
        this.waveCanvas.width = w;
        this.waveCanvas.height = h;

        this.drawSandBackground(w, h);
        this.waveGroup.resize(w, h);
      };

      App.prototype.drawSandBackground = function (w, h) {
        this.sandCtx.fillStyle = "#e2d1a6";
        this.sandCtx.fillRect(0, 0, w, h);

        for (var i = 0; i < 1000; i++) {
          var rx = Math.random() * w;
          var ry = Math.random() * h;
          this.sandCtx.fillStyle =
            Math.random() > 0.5
              ? "rgba(255, 255, 255, 0.25)"
              : "rgba(150, 120, 70, 0.15)";
          this.sandCtx.fillRect(rx, ry, 1.5, 1.5);
        }
      };

      App.prototype.animate = function (t) {
        var self = this;
        var now = Date.now();

        var waveReset = false;
        if (this.drawing.hasDrawn) {
          var idleTime = now - this.drawing.lastDrawTime;
          waveReset = idleTime > 5000;
        }

        this.waveCtx.clearRect(
          0,
          0,
          this.sandCanvas.width,
          this.sandCanvas.height,
        );
        this.waveGroup.update();
        this.waveGroup.draw(this.waveCtx, waveReset);

        if (this.waveGroup.resetFinished) {
          this.drawing.clear();
          this.waveGroup.resetFinished = false;
        }

        requestAnimationFrame(function (t) {
          self.animate(t);
        });
      };

      // 이벤트에 구걸하지 않고 무조건 즉시 실행시키는 핸들러
      function startApp() {
        try {
          new App();
        } catch (e) {
          var debug = document.getElementById("debug-log");
          if (debug) {
            debug.style.display = "block";
            debug.innerHTML = "[Init Error] " + e.message;
          }
        }
      }

      if (
        document.readyState === "complete" ||
        document.readyState === "interactive"
      ) {
        startApp();
      } else {
        document.addEventListener("DOMContentLoaded", startApp);
      }
    </script>
  </body>
</html>
