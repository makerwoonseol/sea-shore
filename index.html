<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Wave Animation</title>
    <link rel="stylesheet" type="text/css" href="style.css" />

    <script>
      window.onerror = function (msg, url, line, col, error) {
        var div = document.getElementById("debug-log");
        if (!div) {
          div = document.createElement("div");
          div.id = "debug-log";
          div.style.cssText =
            "position:fixed;top:0;left:0;width:100%;height:160px;background:rgba(0,0,0,0.9);color:#ff5555;z-index:999999;font-size:13px;overflow:auto;padding:10px;box-sizing:border-box;font-family:monospace;word-break:break-all;";
          document.body.appendChild(div);
        }
        div.innerHTML +=
          '<div style="margin-bottom:6px;border-bottom:1px solid #444;">[JS Error] ' +
          msg +
          "<br>&gt; Line: " +
          line +
          "</div>";
        return false;
      };
    </script>
  </head>
  <body>
    <!-- 버전 확인용 초록색 태그 -->
    <div
      style="
        position: fixed;
        bottom: 10px;
        right: 10px;
        background: rgba(0, 0, 0, 0.85);
        color: #00ff00;
        padding: 4px 8px;
        font-size: 12px;
        z-index: 999999;
        font-family: monospace;
      "
    >
      v1.1.0 (Lite)
    </div>

    <!-- 캐시 강제 새로고침용 v1.1.0 -->
    <script src="app.js?v=1.1.0"></script>
  </body>
</html>
