<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no"
    />

    <!-- 아이패드 홈 화면 추가 시 전체화면 실행 메타 태그 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Wave Canvas" />

    <title>Wave Animation</title>

    <style>
      /* 화면 전체 바운스 및 스크롤 완전 차단 */
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        position: fixed;
        top: 0;
        left: 0;
        touch-action: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        background-color: #f6f2e8;
      }
      canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
    </style>

    <script>
      window.onerror = function (msg, url, line, col, error) {
        var div = document.getElementById("debug-log");
        if (!div) {
          div = document.createElement("div");
          div.id = "debug-log";
          div.style.cssText =
            "position:fixed;top:0;left:0;width:100%;height:160px;background:rgba(0,0,0,0.9);color:#ff5555;z-index:999999;font-size:13px;overflow:auto;padding:10px;box-sizing:border-box;font-family:monospace;word-break:break-all;";
          document.body.appendChild(div);
        }
        div.innerHTML +=
          '<div style="margin-bottom:6px;border-bottom:1px solid #444;">[JS Error] ' +
          msg +
          "<br>&gt; Line: " +
          line +
          "</div>";
        return false;
      };

      /* 터치 스크롤 이벤트 브라우저 수준에서 강제 차단 */
      document.addEventListener(
        "touchmove",
        function (e) {
          if (e.preventDefault) {
            e.preventDefault();
          }
        },
        { passive: false },
      );
    </script>
  </head>
  <body>
    <div
      style="
        position: fixed;
        bottom: 10px;
        right: 10px;
        background: rgba(0, 0, 0, 0.85);
        color: #00ff00;
        padding: 4px 8px;
        font-size: 12px;
        z-index: 999999;
        font-family: monospace;
      "
    >
      v1.2.0 (Ultra Fast)
    </div>

    <script src="app.js?v=1.2.0"></script>
  </body>
</html>
